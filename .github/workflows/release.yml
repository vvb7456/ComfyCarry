# ==============================================================================
# ComfyCarry Release & Pre-release 发布 (GitHub Actions)
#
# 触发与通道:
#   1. push main 分支: 若部署包相关文件有修改, 自动构建并滚动覆盖 dev-latest Pre-release
#   2. push tag v*: 构建并发布正式 latest Release
#   3. workflow_dispatch: 手动选择 dev 或 release 通道构建
# 产物: comfycarry-dist.tar.gz (后端 + 前端 dist + data)
# ==============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "发布通道 (dev: 滚动覆盖 dev-latest 预发布包; release: 发布正式版本)"
        required: true
        type: choice
        options:
          - dev
          - release
        default: dev
      tag:
        description: "正式 Release tag (仅 release 通道必填, 如 v0.8.8, 需与 config.py 的 APP_VERSION 一致)"
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

env:
  ASSET_NAME: comfycarry-dist.tar.gz
  DEV_TAG: dev-latest

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ── 检出代码 (完整历史用于对比变更与更新 dev-latest 标签) ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'release' && inputs.tag || github.ref }}
          fetch-depth: 0

      # ── 确定通道、tag 与是否需要构建 ──
      - name: Resolve channel and check changes
        id: meta
        run: |
          APP_PATHS=(
            comfycarry
            comfycarry_ws_broadcast
            frontend
            data
            workspace_manager.py
            favicon.ico
            bootstrap.sh
            .github/workflows/release.yml
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            if [ "$CHANNEL" = "release" ]; then
              TAG="${{ inputs.tag }}"
              if [ -z "$TAG" ]; then
                echo "::error::release 通道必须填写正式 tag (如 v0.8.8)"
                exit 1
              fi
            else
              TAG="${DEV_TAG}"
            fi
            SHOULD_BUILD="true"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            CHANNEL="release"
            TAG="${GITHUB_REF#refs/tags/}"
            SHOULD_BUILD="true"
          else
            CHANNEL="dev"
            TAG="${DEV_TAG}"
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              SHOULD_BUILD="true"
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${APP_PATHS[@]}"; then
              SHOULD_BUILD="true"
            else
              SHOULD_BUILD="false"
              echo ">>> 本次提交未涉及应用部署包相关文件, 跳过 dev-latest 构建"
            fi
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          COMMIT_SUBJECT=$(git log -1 --format='%s' HEAD)

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "dev_notes<<DEV_EOF"
            echo "开发测试预发布包（滚动更新）"
            echo ""
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- 摘要: ${COMMIT_SUBJECT}"
            echo "DEV_EOF"
          } >> "$GITHUB_OUTPUT"

          echo ">>> Channel: ${CHANNEL} | Tag: ${TAG} | Should build: ${SHOULD_BUILD}"

      # ── 校验 tag 与 APP_VERSION 一致 (仅正式 release) ──
      - name: Verify APP_VERSION matches tag
        if: steps.meta.outputs.should_build == 'true' && steps.meta.outputs.channel == 'release'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APP_VERSION=$(python3 -c "import re; m=re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('comfycarry/config.py').read()); print(m.group(1) if m else '')")
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::tag (${TAG}) 与 comfycarry/config.py APP_VERSION (${APP_VERSION}) 不一致"
            exit 1
          fi

      # ── 提取 CHANGELOG.md 中对应 tag 的变更日志 (仅正式 release) ──
      - name: Extract changelog
        id: changelog
        if: steps.meta.outputs.should_build == 'true' && steps.meta.outputs.channel == 'release'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES=$(python3 -c "
          import re, sys
          tag = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(tag) + r'\b[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not m:
            sys.exit(1)
          print(m.group(1).strip())
          " "$TAG") || { echo "::error::CHANGELOG.md 未找到 ${TAG} 的变更日志段落"; exit 1; }
          {
            echo "notes<<CHANGELOG_EOF"
            printf '%s\n' "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 前端构建 ──
      - name: Setup Node.js
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.meta.outputs.should_build == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build icon font subset
        if: steps.meta.outputs.should_build == 'true'
        working-directory: frontend
        run: |
          pip install fonttools brotli
          bash build-fonts.sh

      - name: Build
        if: steps.meta.outputs.should_build == 'true'
        working-directory: frontend
        run: npm run build

      # ── 打包完整部署 tarball ──
      # 结构 (解压到面板根即得完整部署):
      #   comfycarry/  workspace_manager.py  comfycarry_ws_broadcast/
      #   data/  static/dist/...
      - name: Package dist
        if: steps.meta.outputs.should_build == 'true'
        env:
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "${GDRIVE_CLIENT_SECRET}" ]; then
            echo "::error::未配置 GitHub Secret: GDRIVE_CLIENT_SECRET (请在仓库 Settings -> Secrets and variables -> Actions 中添加)"
            exit 1
          fi

          STAGE="$(mktemp -d)/comfycarry"
          mkdir -p "$STAGE/static"

          cp -r comfycarry "$STAGE/comfycarry"
          cp -r comfycarry_ws_broadcast "$STAGE/comfycarry_ws_broadcast"
          cp -r data "$STAGE/data"
          cp workspace_manager.py "$STAGE/workspace_manager.py"
          cp -r static/dist "$STAGE/static/dist"
          cp favicon.ico "$STAGE/favicon.ico"

          python3 - "$STAGE/comfycarry/config.py" <<'PY'
          import base64, os, pathlib, re, sys

          cfg_path = pathlib.Path(sys.argv[1])
          b64 = base64.b64encode(os.environ["GDRIVE_CLIENT_SECRET"].strip().encode("utf-8")).decode("ascii")
          text = cfg_path.read_text(encoding="utf-8")
          new_text, count = re.subn(
              r'^_BUILTIN_GDRIVE_SECRET_B64\s*=\s*""$',
              f'_BUILTIN_GDRIVE_SECRET_B64 = "{b64}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              sys.exit("注入 _BUILTIN_GDRIVE_SECRET_B64 失败: 未找到占位符")
          cfg_path.write_text(new_text, encoding="utf-8")
          PY

          # 清理 pyc 缓存
          find "$STAGE" -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true

          tar -czf "$ASSET_NAME" -C "$(dirname "$STAGE")" comfycarry
          echo ">>> Packaged $(du -h "$ASSET_NAME" | cut -f1)"
          tar -tzf "$ASSET_NAME" | head -20

      # ── 更新 dev-latest 标签指向当前 commit (仅 dev 通道) ──
      - name: Update dev-latest tag
        if: steps.meta.outputs.should_build == 'true' && steps.meta.outputs.channel == 'dev'
        run: |
          git tag -f "${DEV_TAG}" "${{ steps.meta.outputs.commit_sha }}"
          git push -f origin "refs/tags/${DEV_TAG}"

      # ── 发布 Pre-release (dev 通道) ──
      - name: Publish dev Pre-release
        if: steps.meta.outputs.should_build == 'true' && steps.meta.outputs.channel == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEV_TAG }}
          target_commitish: ${{ steps.meta.outputs.commit_sha }}
          name: ComfyCarry ${{ env.DEV_TAG }} (${{ steps.meta.outputs.short_sha }})
          body: ${{ steps.meta.outputs.dev_notes }}
          files: ${{ env.ASSET_NAME }}
          prerelease: true
          make_latest: false

      # ── 发布正式 Release (release 通道) ──
      - name: Publish Release
        if: steps.meta.outputs.should_build == 'true' && steps.meta.outputs.channel == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.commit_sha }}
          name: ComfyCarry ${{ steps.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          files: ${{ env.ASSET_NAME }}
          prerelease: false
          make_latest: true
