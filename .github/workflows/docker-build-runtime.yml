# ==============================================================================
# ComfyUI Runtime-Minimal Docker 镜像构建 & 推送 (GitHub Actions)
#
# 触发: 手动 / push Dockerfile.runtime 或本工作流
# 产物: ghcr.io/vvb7456/comfycarry:cu130-torch291-runtime-minimal
#        <dockerhub_user>/comfycarry:cu130-torch291-runtime-minimal
#
# 注意: 本工作流是基础镜像减重实验，不得生成或覆盖 latest。
# ==============================================================================

name: Build & Push Runtime-Minimal Docker Image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/Dockerfile.runtime"
      - "docker/entrypoint.sh"
      - "docker/comfycarry-banner.txt"
      - ".github/workflows/docker-build-runtime.yml"
    branches: [main]

concurrency:
  group: docker-runtime-minimal-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vvb7456/comfycarry
  IMAGE_TAG: cu130-torch291-runtime-minimal
  # wheels 版本 — 修改时同步更新 Release tag
  FA2_WHEEL: flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl
  SA2_WHEELS: >-
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm80.whl
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm86.whl
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm89.whl
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm90.whl
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm100.whl
    sageattention-2.2.0-cp312-cp312-linux_x86_64_sm120.whl
  RELEASE_TAG: wheels-v1

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard experimental image tag
        run: |
          if [ "${{ env.IMAGE_TAG }}" = "latest" ]; then
            echo "Runtime-minimal workflow must never publish latest."
            exit 1
          fi

      - name: Download wheels from Release
        run: |
          mkdir -p docker/wheels
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}"

          echo ">>> Downloading FA2 wheel..."
          wget -q -P docker/wheels "${RELEASE_URL}/${{ env.FA2_WHEEL }}"

          echo ">>> Downloading SA2 wheels..."
          for whl in ${{ env.SA2_WHEELS }}; do
            wget -q -P docker/wheels "${RELEASE_URL}/${whl}"
          done

          echo ">>> Downloaded wheels:"
          ls -lh docker/wheels/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime-minimal image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false
          platforms: linux/amd64

      - name: Verify pushed runtime-minimal image
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker buildx imagetools inspect \
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:${{ env.IMAGE_TAG }}"
