# ==============================================================================
# ComfyCarry 生产镜像构建 & 推送 (GitHub Actions)
#
# 基线: NVIDIA cudnn-runtime + 最小 CUDA 编译链
# 触发: 手动 / push 生产 Dockerfile、入口脚本或本工作流
# 产物: x86 latest / ARM arm，分别保留版本标签
# ==============================================================================

name: Build & Push Docker Image

on:
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - "docker/Dockerfile"
      - "docker/entrypoint.sh"
      - "docker/Dockerfile.dockerignore"
      - "comfycarry/services/management_agent.py"
      - "comfycarry/services/usage_collector.py"
      - "comfycarry/services/system_monitor.py"
      - "docker/comfycarry-banner.txt"
      - ".github/workflows/docker-build.yml"
    branches: [main]

concurrency:
  group: docker-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vvb7456/comfycarry
  RELEASE_TAG: wheels-v1  # GitHub Release tag (存放预编译 wheels)

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            tag: latest
            suffix: ""
            wheel_arch: x86_64
            sa_archs: sm80 sm86 sm89 sm90 sm100 sm120
            cuda_archs: "8.0;8.6;8.9;9.0;10.0;12.0"
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag: arm
            suffix: -arm
            wheel_arch: aarch64
            sa_archs: sm120
            cuda_archs: "12.1"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # ── 检出代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 下载预编译 wheels (从 GitHub Release) ──
      - name: Download wheels from Release
        run: |
          mkdir -p docker/wheels
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}"

          echo ">>> Downloading FA2 wheel..."
          wget -q -P docker/wheels "${RELEASE_URL}/flash_attn-2.8.3-cp312-cp312-linux_${{ matrix.wheel_arch }}.whl"

          echo ">>> Downloading SA2 wheels..."
          for arch in ${{ matrix.sa_archs }}; do
            whl="sageattention-2.2.0-cp312-cp312-linux_${{ matrix.wheel_arch }}_${arch}.whl"
            wget -q -P docker/wheels "${RELEASE_URL}/${whl}"
          done

          echo ">>> Downloaded wheels:"
          ls -lh docker/wheels/

      # ── Docker 登录 GHCR ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Docker 登录 Docker Hub ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 设置 Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 构建 & 推送 ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            TORCH_CUDA_ARCH_LIST=${{ matrix.cuda_archs }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu130-torch291${{ matrix.suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu130-torch291-runtime-minimal${{ matrix.suffix }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:${{ matrix.tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:cu130-torch291${{ matrix.suffix }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:cu130-torch291-runtime-minimal${{ matrix.suffix }}
          provenance: false
          sbom: false
          platforms: linux/${{ matrix.arch }}

      # ── 验证 ──
      - name: Verify pushed image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cu130-torch291-runtime-minimal${{ matrix.suffix }}
          docker buildx imagetools inspect docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:${{ matrix.tag }}
          docker buildx imagetools inspect docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry:cu130-torch291-runtime-minimal${{ matrix.suffix }}
