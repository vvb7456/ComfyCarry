# ==============================================================================
# ComfyCarry 生产镜像构建 & 推送 (GitHub Actions)
#
# 基线: NVIDIA cudnn-runtime + 最小 CUDA 编译链
# 触发: 手动 / push 生产 Dockerfile、入口脚本或本工作流
# 产物: Python 3.12 的 v<版本>-x86 / v<版本>-arm
# ==============================================================================

name: Build & Push Docker Image

on:
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - "docker/Dockerfile"
      - "docker/VERSION"
      - "docker/entrypoint.sh"
      - "docker/Dockerfile.dockerignore"
      - "comfycarry/services/management_agent.py"
      - "comfycarry/services/usage_collector.py"
      - "comfycarry/services/system_monitor.py"
      - "docker/comfycarry-banner.txt"
      - ".github/workflows/docker-build.yml"
    branches: [image/py312]

concurrency:
  group: docker-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vvb7456/comfycarry
  RELEASE_TAG: wheels-v1  # GitHub Release tag (存放预编译 wheels)

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            name: x86
            wheel_arch: x86_64
            sa_archs: sm80 sm86 sm89 sm90 sm100 sm120
            cuda_archs: "8.0;8.6;8.9;9.0;10.0;12.0"
          - arch: arm64
            runner: ubuntu-24.04-arm
            name: arm
            wheel_arch: aarch64
            sa_archs: sm120
            cuda_archs: "12.1"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # ── 检出代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成镜像版本和标签
        id: metadata
        run: |
          VERSION=$(cat docker/VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            for image in "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/comfycarry"; do
              echo "${image}:v${VERSION}-${{ matrix.name }}"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # ── 下载预编译 wheels (从 GitHub Release) ──
      - name: Download wheels from Release
        run: |
          mkdir -p docker/wheels
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}"

          echo ">>> Downloading FA2 wheel..."
          wget -q -P docker/wheels "${RELEASE_URL}/flash_attn-2.8.3-cp312-cp312-linux_${{ matrix.wheel_arch }}.whl"

          echo ">>> Downloading SA2 wheels..."
          for arch in ${{ matrix.sa_archs }}; do
            whl="sageattention-2.2.0-0.cu130torch2.9.1.${arch}-cp312-cp312-linux_${{ matrix.wheel_arch }}.whl"
            wget -q -P docker/wheels "${RELEASE_URL}/${whl}"
          done

          echo ">>> Downloaded wheels:"
          ls -lh docker/wheels/

      # ── Docker 登录 GHCR ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Docker 登录 Docker Hub ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 设置 Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 构建 & 推送 ──
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            TORCH_CUDA_ARCH_LIST=${{ matrix.cuda_archs }}
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: false
          sbom: false
          platforms: linux/${{ matrix.arch }}

      # ── 验证 ──
      - name: Verify pushed image
        run: |
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image"
          done <<'TAGS'
          ${{ steps.metadata.outputs.tags }}
          TAGS
